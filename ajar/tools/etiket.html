<title>AJAR — etiket (olives vertes dénoyautées)</title>
<!--
  AJAR ETIKET — wikkeletiket voor de pot, 3 panelen met ronde bovenrand.

  ▸ ALLE TEKST EN WAARDES STAAN IN HET `ETIKET`-OBJECT HIERONDER.
    Wil je een waarde, adres of ingrediënt wijzigen? Pas dáár de tekst aan,
    verder niets. De opmaak volgt automatisch.

  ▸ Het MIDDENBLAD is de originele afbeelding met zijn eigen ronde bovenrand
    (../assets/etiket/ajar-etiket-midden.jpg). Alleen het olijfje boven de J
    is van bordeaux naar olijfgroen omgezet.

  ▸ De boog van de zijpanelen wordt berekend uit dezelfde cirkel als de boog
    van het middenblad, zodat de drie bovenranden vloeiend op elkaar aansluiten.

  ▸ Geen witte randen boven of onder: het etiket loopt tot op de snijlijn.

  ▸ Afdrukken: ⌘P / Ctrl+P → "Opslaan als PDF", marges op "Geen",
    achtergrondafbeeldingen AAN.
-->
<script>
const ETIKET = {

  /* ── Formaat in millimeters ───────────────────────────────────────────── */
  afmetingen: {
    hoogte:   110,     // hoogte van het etiket (op het hoogste punt van de boog)
    midden: 86.75,     // breedte middenblad = hoogte × 642/814 (verhouding van de foto)
    zijkant:   74,     // breedte van het linker- én rechterpaneel
    barcode: 35.4,     // 35,4 mm = 80 % vergroting: de EAN-13 ondergrens om
                       // betrouwbaar te scannen. Niet kleiner maken.
    // Boog, gemeten op de gouden rand van het middenblad (dus zonder de witte
    // franje die in de bronafbeelding om het etiket heen zat).
    boogRand: 120.6/2442,  // hoe diep de boog op de vouwlijn zit
    boogTop:   16.0/2442,  // hoe diep het hoogste punt van de boog zit
  },

  /* ═══ LINKERPANEEL ═════════════════════════════════════════════════════ */
  /* Alle tekst is letterlijk overgenomen van de huidige pot, inclusief de
     schrijfwijze die daar staat. Zie het commentaar bij de regels waar de pot
     zelf een fout heeft. */
  links: {
    nutriTitel: [
      'Information Nutritionnelles par 100g',
      'Nutritional information per 100g',
      'Información Nutricional por 100g',
    ],

    // labels: [frans, engels, spaans]   ·   sub: true → ingesprongen "Dont …"
    nutriRijen: [
      { labels: ['Valeur energétique', 'Energetic value', 'Valor energético'],
        waarde: '595Kj / 145Kcal' },
      { labels: ['Lipides', 'Fat', 'Grasas'],
        waarde: '13,9 g' },
      { labels: ['Dont saturé', 'Saturated', 'De las cuales saturadas'],
        waarde: '1,99 g', sub: true },
      { labels: ['Glucides', 'Carbohydrates', 'Hidratos de carbonos'],
        waarde: '1,32 g' },
      // Op de pot staat hier óók "Dont saturé, Saturated" terwijl het om suikers
      // gaat (het Spaans zegt wel "azúcares"). Letterlijk overgenomen.
      // Verbeterd zou zijn: ['Dont sucres', 'Of which sugars', 'De los cuales azúcares']
      { labels: ['Dont saturé', 'Saturated', 'De los cuales azúcares'],
        waarde: '< 0,2 g', sub: true },
      { labels: ['Proteines', 'Proteins', 'Proteinas'],
        waarde: '1,02 g' },
      { labels: ['Sel', 'Salt', 'Sal'],
        waarde: '3,8 g' },
    ],

    gewichtLabels: [
      'الوزن الصافي المقطر',
      'Poids net égoutté',
      'Net drained weight',
      'Peso netto sgocciolato',
      'Peso netto escurrido',   // pot: Italiaans/Spaans door elkaar; correct Spaans = "Peso neto escurrido"
    ],
    gewicht: '160 g',

    certificaten: [
      { naam: 'ONSSA',          code: 'MA.CFL.47.08.19' },
      { naam: 'MOROCCO FOODEX', code: 'EACCE : GO9671'  },
    ],

    tht: [
      { tekst: 'يستهلك قبل الأجل النهائي المكتوب على الغطاء', rtl: true },
      { tekst: 'À CONSOMMER DE PRÉFÉRENCE AVANT LA DATE FIGURANT SUR LE COUVERCLE' },
      { tekst: 'PREFERABLY CONSUME BEFORE THE DATE ON THE LID' },
      { tekst: 'PREFERIBLEMENTE CONSUMIR ANTES DE LA FECHA EN LA TAPA' },
      { tekst: 'CONSUMARSI PREFERIBILMENTE ENTRO LA DATA RIPORTATA SUL COPERCHIO' },
    ],
  },

  /* ═══ MIDDENBLAD ═══════════════════════════════════════════════════════
     De voorkant is de originele afbeelding. Daarop stond "POIDS NET 130 g",
     wat niet klopt bij een uitlekgewicht van 160 g — uitlekgewicht kan nooit
     hoger zijn dan nettogewicht. Die tekst is uit de afbeelding weggeschilderd;
     hieronder staat wat ervoor in de plaats komt. Zet `midden: null` om er
     helemaal niets te zetten.                                                 */
  midden: {
    label:  'POIDS NET ÉGOUTTÉ',
    waarde: '160 g',
    // vlak dat overgeschilderd wordt, in % van de afbeelding
    vlak: { links: 15.4, boven: 93.4, breedte: 16, hoogte: 6 },
  },

  /* ═══ RECHTERPANEEL ════════════════════════════════════════════════════ */
  rechts: {
    ingredienten: [
      { titel: 'OLIVES VERTES DÉNOYAUTÉES',
        tekst: 'Ingrédients : olives vertes, saumure (eau, sel) correcteur '
             + 'd’acidité : (E330, E270), antioxydant : E300' },
      { titel: 'PITTED GREEN OLIVES',
        tekst: 'Ingredients: green olives, brine (water, salt), acidity '
             + 'regulator: (E330, E270), antioxidant: E300' },
      { titel: 'OLIVE VERDI SNOCCIOLATE',
        tekst: 'Ingredienti: olive verdi, salamoia (acqua, sale) correttori '
             + 'di acidità: (E330, E270), antiossidante: E300' },
      { titel: 'ENTKERNTE GRÜNE OLIVEN',
        tekst: 'Zutaten: grüne Oliven, Salzlake (Wasser, Salz), '
             + 'Säurekorrektor: (E330, E270), Antioxidans: E300' },
      { titel: 'ACEITUNAS VERDES SIN HUESO',
        tekst: 'Ingredientes: aceitunas verdes, salmuera (agua, sal), '
             + 'corrector de acidez: (E330, E270), antioxidante: E300' },
      { titel: 'زيتون أخضر منزوع النوى', rtl: true,
        tekst: 'المكونات : زيتون أخضر، محلول ملحي (ماء، ملح)، '
             + 'معدلات الحموضة : (E330، E270)، مضاد للأكسدة : E300' },
    ],

    herkomst: 'Produit du Maroc / Product of Morocco / إنتاج المغرب',

    bedrijf:    'CONSERVAJAR S.A.R.L',
    bedrijfSub: 'Conserve de Fruits et Légumes (Olives, Abricots, Citrons, Piments...)',
    adres: [
      'Adresse : Lot N°107 Zone industriel BP:768 65800 Taourirt / Maroc',
      'Tél : +212 5 36 69 43 16 + +212 5 36 67 96 36',
      'E-mail : conservajar@gmail.com',
    ],
    web: 'www.ajar.ma',

    ean: '6111264714986',
  },
};

<body>

<div class="bar">
  <b>AJAR — wikkeletiket.</b> Waardes wijzigen? Pas het <code>ETIKET</code>-object
  bovenin dit bestand aan.<br>
  Afdrukken naar PDF: ⌘P / Ctrl+P → marges <b>Geen</b>, achtergronden <b>aan</b>.
</div>

<!-- vormen voor de ronde bovenrand -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="boogZij" clipPathUnits="objectBoundingBox"><path id="boogZijPad"/></clipPath>
</defs></svg>

<div class="etiket" id="etiket">
  <section class="paneel paneel--zij" id="links"></section>

  <section class="paneel paneel--mid">
    <img src="../assets/etiket/ajar-etiket-midden.jpg"
         alt="AJAR — olives vertes dénoyautées, face avant de l’étiquette">
    <div class="midden-gewicht" id="midden-gewicht" hidden></div>
  </section>

  <section class="paneel paneel--zij" id="rechts"></section>
</div>

<script>
(() => {
  const E = ETIKET, A = E.afmetingen;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ── Maten + boog ───────────────────────────────────────────────────── */
  // De zijpanelen krijgen exact dezelfde boog als het middenblad: even diep op
  // de vouwlijn én even hoog in het midden. Zo loopt de bovenrand door over de
  // vouwlijnen en steekt er nergens wit boven uit.
  const boogZij = A.hoogte * A.boogRand;      // diepte op de vouwlijn
  const boogTop = A.hoogte * A.boogTop;       // diepte van het hoogste punt

  const r = document.documentElement.style;
  r.setProperty('--h',        A.hoogte  + 'mm');
  r.setProperty('--w-mid',    A.midden  + 'mm');
  r.setProperty('--w-side',   A.zijkant + 'mm');
  r.setProperty('--w-bar',    A.barcode + 'mm');
  r.setProperty('--boog-zij', boogZij.toFixed(2) + 'mm');

  // Kwadratische bézier: het middelpunt van de curve ligt op (P0 + 2C + P2)/4,
  // dus met C = 2·top − rand komt de top exact op de gewenste hoogte uit.
  const fR = A.boogRand, fT = A.boogTop, fC = (2*fT - fR);
  document.getElementById('boogZijPad')
    .setAttribute('d', `M0,${fR.toFixed(5)} Q0.5,${fC.toFixed(5)} 1,${fR.toFixed(5)} L1,1 L0,1 Z`);

  // sierrand-svg per zijpaneel, in mm (viewBox = werkelijke maten)
  const W = A.zijkant, H = A.hoogte;
  const ctrl = d => (2*(boogTop + d) - (boogZij + d)).toFixed(2);   // stuurpunt bij offset d
  const deco = `
    <svg class="deco" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path class="band" d="M0,${(boogZij + .55).toFixed(2)} Q${W/2},${ctrl(.55)} ${W},${(boogZij + .55).toFixed(2)}"/>
      <path class="rand" d="M2.2,${(boogZij + 2.1).toFixed(2)} Q${W/2},${ctrl(2.1)} ${(W-2.2).toFixed(2)},${(boogZij + 2.1).toFixed(2)}
                            L${(W-2.2).toFixed(2)},${(H-2.2).toFixed(2)} L2.2,${(H-2.2).toFixed(2)} Z"/>
    </svg>`;

  /* ── EAN-13 ─────────────────────────────────────────────────────────── */
  const L  = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G  = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const R2 = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const PAR= ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  const eanCheck = d => { let s = 0; for (let i = 0; i < 12; i++) s += (+d[i]) * (i % 2 ? 3 : 1); return (10 - s % 10) % 10; };

  function barcode(code){
    const d = String(code).replace(/\D/g,'');
    if (d.length !== 13) return { html:'', fout:`EAN moet 13 cijfers zijn (nu ${d.length})` };
    const fout = (+d[12] !== eanCheck(d)) ? `controlecijfer klopt niet — zou ${eanCheck(d)} moeten zijn` : '';

    let bits = '101';
    const par = PAR[+d[0]];
    for (let i = 1; i <= 6; i++) bits += (par[i-1] === 'L' ? L : G)[+d[i]];
    bits += '01010';
    for (let i = 7; i <= 12; i++) bits += R2[+d[i]];
    bits += '101';

    // EAN-13 op 80 %: balkgebied 95 modules breed, balkhoogte 22,85 mm × 0,8
    const ML = 11, MR = 7, H2 = 58, HG = 63, W2 = bits.length + ML + MR;   // incl. rustzones
    const guard = i => (i < 3) || (i >= 45 && i < 50) || (i >= 92);
    let bars = '';
    for (let i = 0; i < bits.length; i++)
      if (bits[i] === '1') bars += `<rect x="${i+ML}" y="0" width="1" height="${guard(i) ? HG : H2}"/>`;

    const txt = (x, t, anchor) =>
      `<text x="${x}" y="${HG+7.5}" text-anchor="${anchor}" font-family="Inter,monospace" font-size="9" letter-spacing=".6">${t}</text>`;

    return { fout, html:
      `<svg viewBox="0 0 ${W2} ${HG+10}" role="img" aria-label="Code-barres ${d}">
         <rect width="${W2}" height="${HG+10}" fill="#FDFBF4"/>
         <g fill="#1A1A18">${bars}
           ${txt(ML-2, d[0], 'end')}
           ${txt(ML+3+21, d.slice(1,7), 'middle')}
           ${txt(ML+50+21, d.slice(7,13), 'middle')}
         </g>
       </svg>` };
  }

  /* ── LINKERPANEEL ───────────────────────────────────────────────────── */
  const l = E.links;
  const rij = x => `
    <tr class="${x.sub ? 'sub' : ''}">
      <td>${esc(x.labels[0])}<span class="ln2">${esc(x.labels[1])} · ${esc(x.labels[2])}</span></td>
      <td class="w">${esc(x.waarde)}</td>
    </tr>`;

  document.getElementById('links').innerHTML = deco + `
    <div class="nutri">
      <div class="nutri-kop">${l.nutriTitel.map(t => `<div>${esc(t)}</div>`).join('')}</div>
      <table><tbody>${l.nutriRijen.map(rij).join('')}</tbody></table>
    </div>

    <div class="gewicht">
      <div class="gewicht-lab">
        ${l.gewichtLabels.map(t =>
          `<div class="${/[؀-ۿ]/.test(t) ? 'ar' : ''}">${esc(t)}${/[؀-ۿ]/.test(t) ? '' : ' :'}</div>`).join('')}
      </div>
      <div class="gewicht-val">${esc(l.gewicht)}</div>
    </div>

    <div class="cert">
      ${l.certificaten.map(c => `
        <div class="cert-badge"><b>${esc(c.naam)}</b><span>${esc(c.code)}</span></div>`).join('')}
    </div>

    <div class="tht">
      ${l.tht.map(t => `<div class="${t.rtl ? 'ar' : ''}">${esc(t.tekst)}</div>`).join('')}
    </div>`;

  /* ── RECHTERPANEEL ──────────────────────────────────────────────────── */
  const rr = E.rechts;
  const bc = barcode(rr.ean);

  // beeldmerk: uit de foto van de pot gehaald (donker blad + olijfblad + oranje blad)
  const merk = `<img class="merkje" src="../assets/etiket/conservajar-beeldmerk.png"
                     alt="ConservAjar">`;

  const herkomst = esc(rr.herkomst)
    .replace(/([؀-ۿ\s]{2,})$/, m => `<span class="ar">${m}</span>`);

  document.getElementById('rechts').innerHTML = deco + `
    <div class="ing">
      ${rr.ingredienten.map(b => `
        <div class="ing-blok ${b.rtl ? 'rtl' : ''}">
          <h3>${esc(b.titel)}</h3>
          <p>${esc(b.tekst)}</p>
        </div>`).join('')}
    </div>

    <div class="bedrijf">
      ${merk}
      <div class="merkje-tx">CONSERVAJAR</div>
      <div class="herkomst">${herkomst}</div>
      <div class="bedrijf-naam">${esc(rr.bedrijf)}</div>
      <div class="bedrijf-sub">${esc(rr.bedrijfSub)}</div>
      <div class="bedrijf-adres">${rr.adres.map(t => `<div>${esc(t)}</div>`).join('')}</div>
      <div class="bedrijf-web">${esc(rr.web)}</div>
    </div>

    <div class="barcode">${bc.html}</div>`;

  /* ── Gewichtsvermelding op de voorkant ──────────────────────────────── */
  if (E.midden) {
    const g = document.getElementById('midden-gewicht'), v = E.midden.vlak;
    g.style.left   = v.links   + '%';
    g.style.top    = v.boven   + '%';
    g.style.width  = v.breedte + '%';
    g.style.height = v.hoogte  + '%';
    g.innerHTML = `<b>${esc(E.midden.label)}</b><span>${esc(E.midden.waarde)}<i>e</i></span>`;
    g.hidden = false;
  }

  /* ── Controles op het scherm ────────────────────────────────────────── */
  const meld = m => document.querySelector('.bar')
    .insertAdjacentHTML('beforeend', `<div class="melding">⚠ ${m}</div>`);

  const teVol = ['links','rechts'].filter(id => {
    const p = document.getElementById(id);
    return p.scrollHeight - p.clientHeight > 1;
  });
  if (teVol.length) meld(`Te veel tekst voor het ${teVol.join(' + ')}paneel — kort in of
    maak <code>afmetingen.zijkant</code> / <code>afmetingen.hoogte</code> groter.`);
  if (bc.fout) meld(`Barcode: ${bc.fout}`);

  /* ── Schaal op scherm ───────────────────────────────────────────────── */
  const et = document.getElementById('etiket');
  function pas(){
    et.style.transform = 'none';
    const breed  = et.getBoundingClientRect().width;
    const ruimte = Math.min(window.innerWidth - 24, 1500);
    const s = Math.min(1, ruimte / breed);
    et.style.transform = `scale(${s})`;
    et.style.marginBottom = `${-(1 - s) * et.getBoundingClientRect().height / s}px`;
  }
  pas();
  addEventListener('resize', pas);
})();
</script>
</body>
</html>
