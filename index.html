<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1715" />
  <title>Sofyan</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sofyan" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
</head>
<body data-theme="dark">
  <div id="splash" class="splash">
    <div class="splash-icon splash-star">✦</div>
    <div class="splash-name">Sofyan</div>
  </div>
  <div id="offline-banner" class="offline-banner">📡 Geen verbinding — werkt offline</div>
  <button id="search-btn" class="settings-btn search-btn" aria-label="Zoeken" onclick="window.openCmdK && window.openCmdK()">🔍</button>
  <button id="settings-btn" class="settings-btn" aria-label="Instellingen">⚙️</button>
  <main id="view" class="view"></main>
  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-route="dashboard" aria-selected="false" aria-label="Dashboard">🏠<span>Home</span></button>
    <button class="tab" role="tab" data-route="taxi" aria-selected="false" aria-label="Taxi">🚖<span>Taxi</span></button>
    <button class="tab" role="tab" data-route="geloof" aria-selected="false" aria-label="Geloof">🕌<span>Geloof</span></button>
    <button class="tab" role="tab" data-route="goals" aria-selected="false" aria-label="Doelen">🎯<span>Doelen</span></button>
    <button class="tab" role="tab" data-route="todo" aria-selected="false" aria-label="To-do">✅<span>To-do</span></button>
    <button class="tab" role="tab" data-route="notes" aria-selected="false" aria-label="Notities">📝<span>Notities</span></button>
    <button class="tab" role="tab" data-route="agenda" aria-selected="false" aria-label="Week">🗓<span>Week</span></button>
    <button class="tab" role="tab" data-route="stats" aria-selected="false" aria-label="Stats">📊<span>Stats</span></button>
    <button class="tab" role="tab" data-route="boekhouding" aria-selected="false" aria-label="Boekhouding">🧾<span>Boekhouding</span></button>
  </nav>
  <script type="module" src="js/app.js"></script>
  <noscript><div style="padding:24px;text-align:center;font-family:system-ui,sans-serif">JavaScript is vereist voor deze app.</div></noscript>
</body>
</html>
