<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1715" />
  <title>Sofyan</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sofyan" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
</head>
<body data-theme="dark">
  <div id="splash" class="splash">
    <div class="splash-icon splash-star">✦</div>
    <div class="splash-name">Sofyan</div>
  </div>
  <div id="offline-banner" class="offline-banner">📡 Geen verbinding — werkt offline</div>
  <button id="search-btn" class="settings-btn search-btn" aria-label="Zoeken" onclick="window.openCmdK && window.openCmdK()">🔍</button>
  <button id="settings-btn" class="settings-btn" aria-label="Instellingen">⚙️</button>
  <main id="view" class="view"></main>
  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-route="dashboard" aria-selected="false" aria-label="Dashboard">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 10.8 12 4l8.6 6.8"/><path d="M5.4 9.5V20h13.2V9.5"/><path d="M9.6 20v-5.2h4.8V20"/></svg><span>Home</span></button>
    <button class="tab" role="tab" data-route="taxi" aria-selected="false" aria-label="Taxi">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.2A2 2 0 0 1 8.4 7.4h7.2a2 2 0 0 1 1.9 1.4L19 13"/><rect x="3.5" y="12.7" width="17" height="4.2" rx="1.3"/><circle cx="7.4" cy="18.4" r="1.4"/><circle cx="16.6" cy="18.4" r="1.4"/><rect x="10.2" y="5.3" width="3.6" height="2.2" rx=".5"/></svg><span>Taxi</span></button>
    <button class="tab" role="tab" data-route="geloof" aria-selected="false" aria-label="Geloof">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 20.3h16.8"/><path d="M5.6 20.3v-7.7h12.8v7.7"/><path d="M5.4 12.8a6.6 6.6 0 0 1 13.2 0"/><path d="M12 3.1v2.4"/><path d="M10.3 20.3v-3a1.7 1.7 0 0 1 3.4 0v3"/><path d="M3.5 20.3v-6.6"/><path d="M20.5 20.3v-6.6"/></svg><span>Geloof</span></button>
    <button class="tab" role="tab" data-route="goals" aria-selected="false" aria-label="Doelen">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg><span>Doelen</span></button>
    <button class="tab" role="tab" data-route="todo" aria-selected="false" aria-label="To-do">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M8.1 12.2l2.7 2.7 5-5.4"/></svg><span>To-do</span></button>
    <button class="tab" role="tab" data-route="notes" aria-selected="false" aria-label="Notities">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.6h8.2L18.6 8v12a.4.4 0 0 1-.4.4H6a.4.4 0 0 1-.4-.4V4a.4.4 0 0 1 .4-.4z"/><path d="M14 3.6V8h4.4"/><path d="M8.4 12.4h7"/><path d="M8.4 15.6h7"/></svg><span>Notities</span></button>
    <button class="tab" role="tab" data-route="agenda" aria-selected="false" aria-label="Week">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="5.2" width="16.4" height="15" rx="2"/><path d="M3.8 9.4h16.4"/><path d="M8 3.4v3.4"/><path d="M16 3.4v3.4"/><path d="M7.6 13h1.6M11.2 13h1.6M14.8 13h1.6M7.6 16.4h1.6M11.2 16.4h1.6"/></svg><span>Week</span></button>
    <button class="tab" role="tab" data-route="stats" aria-selected="false" aria-label="Stats">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.6h16"/><rect x="5.6" y="13.4" width="2.8" height="6.2" rx=".6" fill="currentColor" stroke="none"/><rect x="10.6" y="9.4" width="2.8" height="10.2" rx=".6" fill="currentColor" stroke="none"/><rect x="15.6" y="11.4" width="2.8" height="8.2" rx=".6" fill="currentColor" stroke="none"/></svg><span>Stats</span></button>
    <button class="tab" role="tab" data-route="boekhouding" aria-selected="false" aria-label="Boekhouding">
      <svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.7h12v16.6l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3z"/><path d="M8.5 8h7"/><path d="M8.5 11.4h7"/><path d="M8.5 14.8h4.4"/></svg><span>Boekhouding</span></button>
  </nav>
  <script type="module" src="js/app.js"></script>
  <noscript><div style="padding:24px;text-align:center;font-family:system-ui,sans-serif">JavaScript is vereist voor deze app.</div></noscript>
</body>
</html>
